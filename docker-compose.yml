services:
  # PostgreSQL - מסד הנתונים של האפליקציה
  postgres:
    image: postgres:16-alpine
    container_name: learning_platform_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "-c client_encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_user -d learning_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learning_platform_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learning_platform_api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FASTAPI_ENV: ${FASTAPI_ENV}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - learning_platform_network
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # React Frontend
  frontend:
    build:
      context: ./fronted
      dockerfile: Dockerfile
    container_name: learning_platform_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./fronted/src:/app/src
    depends_on:
      - backend
    networks:
      - learning_platform_network

volumes:
  postgres_data:

networks:
  learning_platform_network:
    driver: bridge